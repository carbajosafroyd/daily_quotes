name: daily quote

on:
  # 11:00 UTC = 7:00 PM Philippine Time (UTC+8)
  schedule:
    - cron: '0 11 * * *'

  # allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: generate quote
        run: python src/generate_quote.py

      - name: commit and push
        run: |
          git config user.name "Froyd"
          git config user.email "froydcarbajosa14@gmail.com"
          git add -A
          git diff --staged --quiet || git commit -m "add quote for $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')"
          git push
